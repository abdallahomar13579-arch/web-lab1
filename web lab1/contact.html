        <h1>Rivers & Seas</h1>
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About Us</a></li>
                <li><a href="services.html">Services & Projects</a></li>
                <li><a href="contact.html">Contact Us</a></li>
            </ul>
        </nav>
    </header>
<main>
        <h2>Get in Touch</h2>
        
        <form action="#" method="post">
            <fieldset>
                <legend>Contact & Volunteer Form</legend>

                <p>
                    <label for="fullname">Full Name:</label><br>
                    <input type="text" id="fullname" name="fullname" required>
                </p>

                <p>
                    <label for="email">Email Address:</label><br>
                    <input type="email" id="email" name="email" required>
                </p>

                <p>
                    <label for="eventdate">Preferred Joining Date:</label><br>
                    <input type="date" id="eventdate" name="eventdate">
                </p>

                <p>
                    <label for="inquiry-type">Inquiry Type:</label><br>
                    <select id="inquiry-type" name="inquiry-type">
                        <option value="volunteer">Volunteer Program</option>
                        <option value="donation">Donations & Support</option>
                        <option value="general">General Question</option>
                    </select>
                </p>

                <p>
                    <label for="message">Your Message:</label><br>
                    <textarea id="message" name="message" rows="5" cols="40"></textarea>
                </p>

                <p>
                    <input type="submit" value="Send Message">
                </p>
            </fieldset>
        </form>
    </main>
